<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0610" />
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="./admin_dashboard.css" />
    <link rel="stylesheet" href="./admin_dashboard_login_ui.css" />
  </head>
  <body>
    <script src="./language.js"></script>
  <script src="./client_protection.js"></script>
    <div id="appLoadingOverlay" class="app-loading-overlay" aria-hidden="true">
      <div class="app-loading-card">
        <div class="app-loading-orbit"><span></span><span></span><span></span></div>
        <div class="app-loading-eyebrow">EVENT VAULT</div>
        <div class="app-loading-title">Please wait</div>
        <div class="app-loading-text">Preparing your workspace and syncing the latest data…</div>
        <div class="app-loading-progress"><span></span></div>
      </div>
    </div>
    <!-- Login overlay (embedded so admin_dashboard.html itself shows login on refresh/unauth) -->
    <div id="adminLoginOverlay" class="admin-login-overlay" aria-hidden="true">
      <div class="snow" aria-hidden="true"></div>
      <section class="admin-login-card" aria-live="polite">
        <h1 class="admin-login-title">Admin Login</h1>


        <form id="verifyForm" class="admin-login-form" autocomplete="off">
          <label class="admin-login-label" for="twoStepKey">Enter 2-Step Authentication Key:</label>
          <div class="admin-login-input-wrap">
            <input
              id="twoStepKey"
              name="twoStepKey"
              class="admin-login-input"
              type="password"
              inputmode="numeric"
              placeholder="Enter 2-Step Key"
              autocomplete="current-password"
              required
            />
            <button id="togglePass" class="admin-login-pass-toggle" type="button" aria-label="Show authentication key" aria-pressed="false"><i class="fa-regular fa-eye"></i></button>
          </div>

          <button id="verifyBtn" class="admin-login-btn" type="submit">
            Verify
          </button>

          <p id="message" class="admin-login-message" role="status"></p>
        </form>
      </section>
    </div>

    <div id="adminActionModal" class="admin-action-modal" aria-hidden="true">
      <div class="admin-action-backdrop" data-modal-close="true"></div>
      <section class="admin-action-card" role="dialog" aria-modal="true" aria-labelledby="adminActionTitle">
        <div class="admin-action-icon" id="adminActionIcon">✓</div>
        <div class="admin-action-eyebrow" id="adminActionEyebrow">ADMIN ACTION</div>
        <h2 id="adminActionTitle">Operation Successful</h2>
        <p id="adminActionMessage">Your changes have been saved.</p>
        <div class="admin-action-actions">
          <button id="adminActionCancel" class="a-btn admin-action-secondary" type="button">Cancel</button>
          <button id="adminActionConfirm" class="a-btn admin-action-primary" type="button">Continue</button>
        </div>
      </section>
    </div>

    <div class="app">

      <aside class="sidebar" aria-label="Admin navigation">
        <div class="brand">
          <div class="brand__dot" aria-hidden="true"></div>
          <div class="brand__title">Admin</div>
        </div>

        <nav class="nav" role="navigation">
          <button
            class="nav__item is-active"
            type="button"
            data-view="banquet-management"
          >
            Banquet Management
          </button>
          <button
            class="nav__item"
            type="button"
            data-view="banquet-spreadsheet"
          >
            Banquet Spreadsheet
          </button>
          <button
            class="nav__item"
            type="button"
            data-view="hall-management"
          >
            Hall Management
          </button>
          <button
            class="nav__item"
            type="button"
            data-view="hall-spreadsheet"
          >
            Hall Spreadsheet
          </button>
          <button
            class="nav__item"
            type="button"
            data-view="master-record"
          >
            Master Record
          </button>

        </nav>

        <div class="sidebar__footer">
          <button class="link-btn" id="logoutBtn" type="button">
            Log out
          </button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div class="topbar__left">
            <h1 class="topbar__title" id="pageTitle">Banquet Management</h1>
            <p class="topbar__subtitle">Select an option from the left panel.</p>
          </div>

          <div class="topbar__right">
            <div class="pill" id="statusPill">Ready</div>
          </div>
        </header>

        <section class="panel" aria-live="polite">
          <div class="panel__inner">
            <div id="viewContainer">
              <!-- injected by admin_dashboard.js -->
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./admin_dashboard.js"></script>
  </body>
</html>

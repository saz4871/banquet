<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0710">
  <title>Admin Access | Event Vault</title>
  <link rel="stylesheet" href="./admin_login.css">
</head>
<body>
  <main class="page">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <section class="card" aria-labelledby="loginTitle">
      <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-crown"></i></div>
      <p class="eyebrow">EVENT VAULT • SECURE AREA</p>
      <h1 id="loginTitle" class="title">Welcome back, Admin</h1>
      <p class="subtitle">Enter your 2-step authentication key to continue to the management console.</p>

      <form id="verifyForm" class="form" autocomplete="off">
        <label class="label" for="twoStepKey">2-Step Authentication Key</label>
        <div class="input-wrap">
          <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          <input id="twoStepKey" name="twoStepKey" class="input" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter your secure key" required>
          <button class="toggle-pass" id="togglePass" type="button" aria-label="Show authentication key"><i class="fa-regular fa-eye"></i></button>
        </div>

        <button id="verifyBtn" class="btn" type="submit">
          <span class="btn-label">Verify & Continue</span>
          <span class="btn-loader" aria-hidden="true"></span>
          <i class="fa-solid fa-arrow-right btn-arrow" aria-hidden="true"></i>
        </button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="security-note"><i class="fa-solid fa-lock" aria-hidden="true"></i><span>Your session is protected by Firebase access rules.</span></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js" defer></script>
  <script type="module" src="./admin_login.js"></script>
</body>
</html>
